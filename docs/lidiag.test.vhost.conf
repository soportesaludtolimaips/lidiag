# ==========================================================================
# Vhost para LIDiag — pegar en:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Requiere: mod_ssl y mod_rewrite habilitados en httpd.conf, y el include
# de httpd-vhosts.conf activo. Luego reiniciar Apache.
# ==========================================================================

<VirtualHost *:80>
    ServerName lidiag.test
    DocumentRoot "C:/xampp/htdocs/lidiag-main/public"

    <Directory "C:/xampp/htdocs/lidiag-main/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/lidiag.test-error.log"
    CustomLog "logs/lidiag.test-access.log" common
</VirtualHost>

<VirtualHost *:443>
    ServerName lidiag.test
    DocumentRoot "C:/xampp/htdocs/lidiag-main/public"

    SSLEngine on
    SSLCertificateFile "C:/xampp/htdocs/lidiag-main/ssl.crt"
    SSLCertificateKeyFile "C:/xampp/htdocs/lidiag-main/ssl.key"

    <Directory "C:/xampp/htdocs/lidiag-main/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/lidiag.test-ssl-error.log"
    CustomLog "logs/lidiag.test-ssl-access.log" common
</VirtualHost>
